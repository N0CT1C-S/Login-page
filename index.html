<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <form class="bg">
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama">
            </div>

            <div class="form-group">
                <label for="Password">Password</label>
                <input type="password" id="Password" name="Password">
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label><input type="radio" name="kelamin" value="Laki-Laki" checked>Laki-laki</label>
                    <label><input type="radio" name="kelamin" value="Perempuan">Perempuan</label>
                    <label><input type="radio" name="kelamin" value="Tidak Ingin memberi tahu">Tidak Ingin memberi tahu</label>
                </div>
            </div>

            <div class="form-group">
                <label for="hobi">Hobi:</label>
                  <select name="hobi" id="hobi">
                    <option value="Gowes">Gowes</option>
                    <option value="Baca Buku">Baca Buku</option>
                    <option value="Renang">Renang</option>
                    <option value="Joging">Joging</option>
                    <option value="Menulis">Menulis</option>
                    <option value="Sigma">Sigma</option>
                    <option value="Mewing">Mewing</option>
                  </select>
            </div>

            <div class="form-group">
                <label for="kota">Asal Kota:</label>
                <select name="kota" id="kota">
                    <option value="Cirebon">Cirebon</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Papua">Papua</option>
                    <option value="Bali">Bali</option>
                    <option value="Ambon">Ambon</option>
                    <option value="Balikpapan">Balikpapan</option>
                    <option value="Banda Aceh">Banda Aceh</option>
                    <option value="Bandar Lampung">Bandar Lampung</option>
                    <option value="Bandung">Bandung</option>
                    <option value="Banjarmasin">Banjarmasin</option>
                    <option value="Batam">Batam</option>
                    <option value="Bekasi">Bekasi</option>
                    <option value="Bengkulu">Bengkulu</option>
                    <option value="Bogor">Bogor</option>
                    <option value="Cimahi">Cimahi</option>
                    <option value="Cirebon">Cirebon</option>
                    <option value="Denpasar">Denpasar</option>
                    <option value="Depok">Depok</option>
                    <option value="Gorontalo">Gorontalo</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Jambi">Jambi</option>
                    <option value="Jayapura">Jayapura</option>
                    <option value="Kediri">Kediri</option>
                    <option value="Kendari">Kendari</option>
                    <option value="Kupang">Kupang</option>
                    <option value="Madiun">Madiun</option>
                    <option value="Makassar">Makassar</option>
                    <option value="Malang">Malang</option>
                    <option value="Manado">Manado</option>
                    <option value="Mataram">Mataram</option>
                    <option value="Medan">Medan</option>
                    <option value="Padang">Padang</option>
                    <option value="Palangkaraya">Palangkaraya</option>
                    <option value="Palembang">Palembang</option>
                    <option value="Palu">Palu</option>
                    <option value="Pekanbaru">Pekanbaru</option>
                    <option value="Pontianak">Pontianak</option>
                    <option value="Samarinda">Samarinda</option>
                    <option value="Semarang">Semarang</option>
                    <option value="Solo">Solo (Surakarta)</option>
                    <option value="Sorong">Sorong</option>
                    <option value="Surabaya">Surabaya</option>
                    <option value="Tangerang">Tangerang</option>
                    <option value="Tangerang Selatan">Tangerang Selatan</option>
                    <option value="Tasikmalaya">Tasikmalaya</option>
                    <option value="Ternate">Ternate</option>
                    <option value="Yogyakarta">Yogyakarta</option>
                </select>
            </div>

            <div class="form-group">
                <label for="komentar">Komentar Kamu:</label>
                <textarea name="komentar" id="komentar" rows="4" placeholder="Masukkan komentar"></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim</button>
        </form>
    </main>
</body>
</html>
